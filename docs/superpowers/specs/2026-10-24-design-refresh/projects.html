<style>
/* Layout: one page, two shifts. The 9 to 5 / 5 to 9 switch flips the sky (day blue with a monoline amber sun,
   night black with a moon and stars) and swaps which projects show, as a bento grid where every tile is one
   colour with the project's mark stencilled on it in a single tone. A story page per project. Names roll. */
:root {
  --night: #000000;
  --day: #0b1d33;
  --bg: var(--night);
  --ink: #f1f2f3;
  --ink-2: #a9b0b9;
  --line: rgba(255, 255, 255, 0.14);
  --tile: #0c0d10;
  --amber: #ffc24d;
  --display: "Big Shoulders", "Arial Narrow", Impact, sans-serif;
  --text: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
@media (min-width: 720px) { :root { --gl: max(32px, env(safe-area-inset-left, 0px)); --gr: max(32px, env(safe-area-inset-right, 0px)); } }
body.day { --bg: var(--day); --tile: #10284a; --line: rgba(255, 255, 255, 0.18); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color 900ms ease; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: -0.005em; text-wrap: balance; }
.wrap { padding-left: var(--gl); padding-right: var(--gr); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the letter roll from the live site: every letter slides up to an identical copy, 30 ms apart */
.w { display: inline-block; white-space: nowrap; }
.f { display: inline-block; height: 1em; overflow: hidden; vertical-align: top; }
.f i { display: block; font-style: normal; line-height: 1; height: 1em; transition: transform 320ms var(--ease) calc(var(--i) * 30ms); }
.hot:hover .f i, .hot:focus-visible .f i { transform: translateY(-100%); }

/* sky */
.stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 1; transition: opacity 900ms ease; }
body.day .stars { opacity: 0; }
.stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--ink); animation: twinkle 4s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: 0.15; } }
/* the sun and moon: one particle cloud that re-forms between the two; drawn on black and screen-blended,
   so the day blue shows through everywhere the light isn't */
.sky3d { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; pointer-events: none; mix-blend-mode: screen; }

.bar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; }
.mark { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: 0.02em; }

main { position: relative; }  /* no z-index: the sky canvas must blend with the page colour behind it */
.head { position: relative; display: grid; gap: 28px; padding-block: 40px 56px; }
.head > :not(canvas) { position: relative; z-index: 1; }
.head h1 { font-size: clamp(88px, 16vw, 236px); line-height: 0.8; }
/* the switch: a white pill slides (and stretches on the way) under whichever shift is on */
.flip { position: relative; display: inline-flex; width: max-content; max-width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 5px; background: rgba(0, 0, 0, 0.3); }
.thumb { position: absolute; top: 5px; bottom: 5px; left: 5px; width: 0; border-radius: 999px; background: var(--ink); }
.flip button { position: relative; display: inline-flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 26px 0 20px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); cursor: pointer; font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 34px); text-transform: uppercase; letter-spacing: 0.01em; transition: color 260ms ease 140ms; }
.flip button svg { width: 26px; height: 26px; flex: none; overflow: visible; }
.flip button svg * { transform-box: view-box; transform-origin: 12px 12px; }
.flip button:hover { color: var(--ink); }
.flip button[aria-pressed="true"] { color: var(--bg); }
@media (max-width: 640px) { .flip button { min-height: 50px; gap: 8px; padding: 0 18px 0 14px; font-size: 22px; } .flip button svg { width: 22px; height: 22px; } }
.intro { margin: 0; max-width: 46ch; font-size: clamp(19px, 1.7vw, 23px); line-height: 1.4; color: var(--ink-2); text-wrap: pretty; }
.intro b { color: var(--ink); font-weight: 600; }

#list { position: relative; padding-block: 8px 120px; }
/* tiles rise in one after another, their marks pop in just behind them; switching shifts drops the old set first */
.t { animation: rise 680ms var(--ease) backwards; animation-delay: calc(var(--k) * 55ms); }
.t .art { animation: pop 820ms var(--ease) backwards; animation-delay: calc(var(--k) * 55ms + 150ms); }
.t.out { animation: sink 280ms cubic-bezier(0.55, 0, 0.75, 0.2) forwards; animation-delay: calc(var(--k) * 26ms); }
@keyframes rise { from { opacity: 0; transform: translateY(32px) scale(0.96); } }
@keyframes pop { from { opacity: 0; transform: scale(0.8) rotate(-8deg); } }
@keyframes sink { to { opacity: 0; transform: translateY(18px) scale(0.97); } }

/* the mark: a one-tone stencil of the project's logo (or a drawn icon), painted in the tile's ink */
.mk { display: block; width: 100%; height: 100%; transform: scale(var(--s, 1)); background: var(--mk); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.ico { display: block; width: 100%; height: 100%; color: var(--mk); overflow: visible; }

/* bento: four columns, sizes chosen so each shift fills four full rows; every tile is one solid colour */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: clamp(190px, 17vw, 260px); grid-auto-flow: dense; gap: 12px; }
.t { position: relative; display: grid; overflow: hidden; border-radius: 10px; background: var(--fill); color: var(--txt); padding: clamp(16px, 1.6vw, 24px); }
.t .art { position: relative; min-height: 0; min-width: 0; transition: transform 700ms var(--ease); }
.t:hover .art, .t:focus-visible .art { transform: scale(1.06) rotate(-2deg); }
.t .cap { display: grid; gap: 8px; align-content: end; min-width: 0; }
.t .kind { margin: 0; font-size: 14px; font-weight: 600; opacity: 0.78; }
.t h3 { font-size: clamp(30px, 2.6vw, 46px); line-height: 1; }
.t .line { margin: 0; font-size: 15px; line-height: 1.4; opacity: 0.86; max-width: 36ch; text-wrap: pretty; }
.t.xl { grid-column: span 2; grid-row: span 2; grid-template-rows: minmax(0, 1fr) auto; gap: 20px; }
.t.xl .art { margin: 6% 18% 0; }
.t.xl h3 { font-size: clamp(48px, 5vw, 88px); }
.t.xl .line { font-size: 17px; }
.t.tall { grid-row: span 2; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; }
.t.tall .art { margin: 10% 8% 0; }
.t.wide { grid-column: span 2; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }
.t.wide .art { grid-column: 2; grid-row: 1; margin: 4% 4% 4% 10%; }
.t.wide .cap { grid-column: 1; grid-row: 1; }
.t.single { grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
.t.single .art { justify-self: end; width: 58%; }
.t.single .line, .t.tall .line { display: none; }
@media (max-width: 760px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 172px; gap: 10px; }
  .t .line, .t:not(.xl) .kind { display: none; }
  .t h3 { font-size: 28px; }
  .t.xl h3 { font-size: 44px; }
}

/* story page */
.story { padding-block: 24px 120px; display: grid; gap: 48px; }
.back { justify-self: start; font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; color: var(--ink-2); }
.back:hover { color: var(--ink); }
.s-head { display: grid; gap: 20px; max-width: 1200px; }
.eyebrow { margin: 0; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.eyebrow svg { width: 22px; height: 22px; color: var(--ink); }
.s-head h1 { font-size: clamp(76px, 13vw, 210px); line-height: 0.86; }
.pitch { margin: 0; max-width: 30ch; font-size: clamp(24px, 2.6vw, 38px); font-weight: 500; line-height: 1.22; letter-spacing: -0.01em; text-wrap: balance; }
.s-media { position: relative; overflow: hidden; aspect-ratio: 16 / 9; max-height: 78svh; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--tile); }
.s-media > img, .s-media > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.s-media.art-field { border: 0; background: var(--fill); }
.s-media.art-field .art { position: absolute; inset: 18% 30%; }
.s-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 48px; align-items: start; }
.stat { position: sticky; top: 32px; display: grid; gap: 6px; margin: 0; }
.stat b { font-family: var(--display); font-weight: 900; font-size: clamp(64px, 7vw, 120px); line-height: 0.9; color: var(--amber); font-variant-numeric: tabular-nums; }
.stat span { max-width: 22ch; color: var(--ink-2); font-size: 17px; line-height: 1.4; }
/* the three parts hang off one line, a node per part */
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 44px; position: relative; }
.flow::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 1px; background: var(--line); }
.flow li { position: relative; padding-left: 44px; display: grid; gap: 12px; }
.flow li::before { content: ""; position: absolute; left: 0; top: 8px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--bg); transition: background-color 900ms ease; }
.flow h2 { font-size: clamp(34px, 3.2vw, 50px); line-height: 0.95; }
.flow p { margin: 0; max-width: 60ch; font-size: clamp(18px, 1.45vw, 21px); line-height: 1.5; text-wrap: pretty; }
.visit { margin: 0; display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: 18px; font-weight: 600; }
.visit a { border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.visit a:hover { border-color: var(--ink); }
.next { display: grid; gap: 10px; padding-top: 36px; border-top: 1px solid var(--line); }
.next small { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.next strong { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(56px, 9vw, 150px); line-height: 0.95; }
.next strong .arr { display: inline-block; margin-left: 0.15em; color: var(--amber); transition: transform 320ms var(--ease); }
.next:hover .arr { transform: translateX(0.12em); }
@media (max-width: 820px) { .s-body { grid-template-columns: minmax(0, 1fr); gap: 40px; } .stat { position: static; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; } }

<script type="importmap">{ "imports": {

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('sky'), head = canvas.parentElement;
